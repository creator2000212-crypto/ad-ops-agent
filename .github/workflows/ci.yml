name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Offline contract tests
        run: python -m unittest discover -s tests -v
      - name: Demonstrate execution and recovery
        run: python scripts/demo.py
      - name: Demonstrate scoped private methods and corrections
        run: python scripts/demo_private_memory.py
      - name: Check public repository contents
        run: python scripts/check_repository.py
