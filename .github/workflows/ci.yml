name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Offline contract tests
        run: python -m unittest discover -s tests -v
      - name: Demonstrate execution and recovery
        run: python scripts/demo.py
      - name: Demonstrate scoped private methods and corrections
        run: python scripts/demo_private_memory.py
      - name: Demonstrate six business and method workflows
        run: python scripts/demo_methods.py
      - name: Demonstrate the recurring operating loop and its write gate
        run: python scripts/demo_operating_loop.py
      - name: Walk the same loop one stage at a time
        run: python demo/run_demo.py --steps > /dev/null
      - name: Verify the committed demo sample still matches a fresh run
        run: python demo/run_demo.py --check
      - name: Check public repository contents
        run: python scripts/check_repository.py
