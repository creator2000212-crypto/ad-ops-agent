<text x="282" y="212" font-family="Arial, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#F0F8F0">准备方案</text>
<path d="M513 161 L669 161" fill="none" stroke="#3C5D4B" stroke-width="2"/>
<path d="M658 156 L669 161 L658 166" fill="none" stroke="#3C5D4B" stroke-width="2"/>
<circle cx="488" cy="161" r="21" fill="#94DFB3"/>
<text x="488" y="168" font-family="Arial, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#10281F">3</text>
<text x="488" y="212" font-family="Arial, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="600" text-anchor="middle" fill="#F0F8F0">整批确认</text>
<path d="M719 161 L875 161" fill="none" stroke="#3C5D4B" stroke-width="2"/>
<path d="M864 156 L875 161 L864 166" fill="none" stroke="#3C5D4B" stroke-width="2"/>
<circle cx="694" cy="161" r="21" fill="#254939"/>
<text x="694" y="168" font-family="Arial, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#94DFB3">4</text>
<text x="694" y="212" font-family="Arial, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#F0F8F0">授权执行</text>
