<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="302" viewBox="0 0 1200 302" role="img" aria-labelledby="t d">
<title id="t">Reusable workflow</title><desc id="d">Workflow illustration, not a deployment diagram: understand business, prepare, confirm scope, execute authorized actions, verify results, review. Tools and methods remain user-specific.</desc>
<rect x="0" y="0" width="1200" height="302" rx="20" fill="#10281F"/>
<text x="40" y="46" font-family="Arial, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#94DFB3" letter-spacing="1.3">THE REUSABLE WORKFLOW</text>
<text x="40" y="98" font-family="Arial, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="33" font-weight="650" text-anchor="start" fill="#F0F8F0">通用的是流程，不是固定投法</text>
<path d="M103 161 L257 161" fill="none" stroke="#3C5D4B" stroke-width="2"/>
<path d="M246 156 L257 161 L246 166" fill="none" stroke="#3C5D4B" stroke-width="2"/>
<circle cx="78" cy="161" r="21" fill="#254939"/>
<text x="78" y="168" font-family="Arial, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#94DFB3">1</text>
<text x="78" y="212" font-family="Arial, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#F0F8F0">理解业务</text>
<path d="M307 161 L463 161" fill="none" stroke="#3C5D4B" stroke-width="2"/>
<path d="M452 156 L463 161 L452 166" fill="none" stroke="#3C5D4B" stroke-width="2"/>
<circle cx="282" cy="161" r="21" fill="#254939"/>
