<path d="M1068 156 L1079 161 L1068 166" fill="none" stroke="#3C5D4B" stroke-width="2"/>
<circle cx="900" cy="161" r="21" fill="#254939"/>
<text x="900" y="168" font-family="Arial, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#94DFB3">5</text>
<text x="900" y="212" font-family="Arial, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#F0F8F0">结果核对</text>
<circle cx="1104" cy="161" r="21" fill="#254939"/>
<text x="1104" y="168" font-family="Arial, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#94DFB3">6</text>
<text x="1104" y="212" font-family="Arial, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#F0F8F0">复盘迭代</text>
<path d="M40 244 L1160 244" fill="none" stroke="#3C5D4B" stroke-width="1"/>
<text x="40" y="277" font-family="Arial, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#AEC8B7">产品、用户方法与可用工具可更换；目标和执行范围由人决定。</text>
