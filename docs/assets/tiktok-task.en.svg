<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="548" viewBox="0 0 1040 548" role="img" aria-labelledby="title desc">
  <title id="title">Historical TikTok task: three business lines, item-by-item handoff</title>
  <desc id="desc">WB-02, reconstructed from historical records, not a UI screenshot. Inputs: three business lines, existing assets and account settings, and old structures. The buyer reviews structure, assets and treatment of old lines; some conditions remain open. The agent adjusts assets, creates structure, reads object states and hands off results. The historical receipt records lines A and B as AD_STATUS_DELIVERY_OK and line C as AD_STATUS_AUDIT. Eligibility does not establish observed spend, current state or performance.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#788ca3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 29px; font-weight: 750; fill: #152d46; }
      .subtitle { font-size: 16px; fill: #52667e; }
      .heading { font-size: 22px; font-weight: 700; fill: #152d46; }
      .body { font-size: 18px; fill: #41556d; }
      .number { font-size: 13px; font-weight: 700; fill: #3154bf; }
      .code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; fill: #52667e; }
      .line { font-size: 18px; font-weight: 650; fill: #344b62; }
      .status { font-size: 23px; font-weight: 750; }
      .foot { font-size: 16px; fill: #52667e; }
    </style>
  </defs>
  <rect width="1040" height="548" rx="20" fill="#f4f7fb"/>
  <text x="32" y="47" class="title">A TikTok task, from inputs to handoff</text>
  <text x="32" y="77" class="subtitle">WB-02 · Reconstructed from historical records · not a UI screenshot</text>

  <g>
    <rect x="32" y="104" width="304" height="180" rx="14" fill="#fff" stroke="#ccd8e5"/>
    <circle cx="64" cy="136" r="15" fill="#edf1ff"/>
    <text x="64" y="141" class="number" text-anchor="middle">01</text>
    <text x="90" y="144" class="heading">Task inputs</text>
    <text x="54" y="185" class="body">Three business lines</text>
    <text x="54" y="216" class="body">Existing assets and settings</text>
    <text x="54" y="247" class="body">Older delivery structures</text>
  </g>
  <path d="M344 194 H358" fill="none" stroke="#788ca3" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="368" y="104" width="304" height="180" rx="14" fill="#fff" stroke="#ccd8e5"/>
    <circle cx="400" cy="136" r="15" fill="#edf1ff"/>
    <text x="400" y="141" class="number" text-anchor="middle">02</text>
    <text x="426" y="144" class="heading">Buyer decisions</text>
    <text x="390" y="185" class="body">Review structure, assets</text>
    <text x="390" y="216" class="body">and treatment of old lines</text>
    <rect x="390" y="235" width="258" height="29" rx="7" fill="#fff2cf"/>
    <text x="402" y="255" font-size="15" font-weight="600" fill="#805300">Some conditions still open</text>
  </g>
  <path d="M680 194 H694" fill="none" stroke="#788ca3" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="704" y="104" width="304" height="180" rx="14" fill="#fff" stroke="#ccd8e5"/>
    <circle cx="736" cy="136" r="15" fill="#edf1ff"/>
    <text x="736" y="141" class="number" text-anchor="middle">03</text>
    <text x="762" y="144" class="heading">Agent work</text>
    <text x="726" y="185" class="body">Adjust assets; create structure</text>
    <text x="726" y="216" class="body">Read native object states</text>
    <text x="726" y="247" class="body">Hand off results and gaps</text>
  </g>
  <path d="M856 291 V307" fill="none" stroke="#788ca3" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="32" y="316" width="976" height="150" rx="14" fill="#fff" stroke="#bdccdc"/>
  <text x="54" y="349" font-size="21" font-weight="700" fill="#152d46">Handoff · recorded object states</text>
  <text x="986" y="349" font-size="18" font-weight="650" fill="#344b62" text-anchor="end">2 eligible · 1 in review</text>
  <g>
    <rect x="52" y="365" width="300" height="81" rx="10" fill="#eaf7f0"/>
    <text x="70" y="395" class="line">Line A</text>
    <text x="332" y="395" class="status" text-anchor="end" fill="#066a50">Eligible</text>
    <text x="70" y="426" class="code">AD_STATUS_DELIVERY_OK</text>
  </g>
  <g>
    <rect x="370" y="365" width="300" height="81" rx="10" fill="#eaf7f0"/>
    <text x="388" y="395" class="line">Line B</text>
    <text x="650" y="395" class="status" text-anchor="end" fill="#066a50">Eligible</text>
    <text x="388" y="426" class="code">AD_STATUS_DELIVERY_OK</text>
  </g>
  <g>
    <rect x="688" y="365" width="300" height="81" rx="10" fill="#fff3d9"/>
    <text x="706" y="395" class="line">Line C</text>
    <text x="968" y="395" class="status" text-anchor="end" fill="#805300">In review</text>
    <text x="706" y="426" class="code">AD_STATUS_AUDIT</text>
  </g>
  <text x="32" y="499" class="foot">Eligible does not mean spend was observed. Items in review still need follow-up.</text>
  <text x="32" y="525" class="foot">Historical receipt summary only; not evidence of current state, spend or performance.</text>
</svg>
