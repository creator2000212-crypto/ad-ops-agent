<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="548" viewBox="0 0 1040 548" role="img" aria-labelledby="title desc">
  <title id="title">Facebook (Meta): from assets to a reviewable plan</title>
  <desc id="desc">Reconstructed from historical records, not a UI screenshot. Using product context, existing assets and delivery records, the agent organizes creative candidates under the method, records selection reasons and prior use, and prepares copy and configuration drafts. The buyer reviews creatives, budget scope, attribution settings and treatment of old structures. Deliverables include 20 proposed ad entries, 20 copy sets and setup drafts, and open decisions. This is preparation evidence, not proof of publication, current effective state or performance.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#788ca3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 29px; font-weight: 750; fill: #152d46; }
      .subtitle { font-size: 16px; fill: #52667e; }
      .heading { font-size: 22px; font-weight: 700; fill: #152d46; }
      .body { font-size: 18px; fill: #41556d; }
      .number { font-size: 13px; font-weight: 700; fill: #3154bf; }
      .code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; fill: #52667e; }
      .line { font-size: 18px; font-weight: 650; fill: #344b62; }
      .status { font-size: 23px; font-weight: 750; }
      .foot { font-size: 16px; fill: #52667e; }
    </style>
  </defs>
  <rect width="1040" height="548" rx="20" fill="#f4f7fb"/>
  <text x="32" y="47" class="title">Facebook (Meta): from assets to a reviewable plan</text>
  <text x="32" y="77" class="subtitle">Reconstructed from historical records · not a UI screenshot</text>

  <g>
    <rect x="32" y="104" width="304" height="180" rx="14" fill="#fff" stroke="#ccd8e5"/>
    <circle cx="64" cy="136" r="15" fill="#edf1ff"/>
    <text x="64" y="141" class="number" text-anchor="middle">01</text>
    <text x="90" y="144" class="heading">Task inputs</text>
    <text x="54" y="185" font-size="17" fill="#41556d">Two business lines and a method</text>
    <text x="54" y="216" class="body">Assets and advertising records</text>
    <text x="54" y="247" font-size="17" fill="#41556d">Account and measurement setup</text>
  </g>
  <path d="M344 194 H358" fill="none" stroke="#788ca3" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="368" y="104" width="304" height="180" rx="14" fill="#fff" stroke="#ccd8e5"/>
    <circle cx="400" cy="136" r="15" fill="#edf1ff"/>
    <text x="400" y="141" class="number" text-anchor="middle">02</text>
    <text x="426" y="144" class="heading">Agent preparation</text>
    <text x="390" y="185" class="body">Organize creative candidates</text>
    <text x="390" y="216" class="body">Record rationale and prior use</text>
    <text x="390" y="247" class="body">Draft copy and configuration</text>
  </g>
  <path d="M680 194 H694" fill="none" stroke="#788ca3" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="704" y="104" width="304" height="180" rx="14" fill="#fff" stroke="#ccd8e5"/>
    <circle cx="736" cy="136" r="15" fill="#edf1ff"/>
    <text x="736" y="141" class="number" text-anchor="middle">03</text>
    <text x="762" y="144" class="heading">Buyer review</text>
    <text x="726" y="185" font-size="17" fill="#41556d">Review creatives and budget</text>
    <text x="726" y="216" class="body">Attribution and old structures</text>
    <rect x="726" y="235" width="258" height="29" rx="7" fill="#fff2cf"/>
    <text x="738" y="255" font-size="15" font-weight="600" fill="#805300">Open decisions, not approval</text>
  </g>
  <path d="M856 291 V307" fill="none" stroke="#788ca3" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="32" y="316" width="976" height="150" rx="14" fill="#fff" stroke="#bdccdc"/>
  <text x="54" y="349" font-size="21" font-weight="700" fill="#152d46">Handoff · a reviewable plan</text>
  <text x="986" y="349" font-size="18" font-weight="650" fill="#344b62" text-anchor="end">Prepared · publishing not verified</text>
  <g>
    <rect x="52" y="365" width="300" height="81" rx="10" fill="#edf2fc"/>
    <text x="70" y="395" font-size="21" font-weight="700" fill="#284d9a">Candidate list</text>
    <text x="70" y="427" font-size="23" font-weight="600" fill="#344b62">20 candidate entries</text>
  </g>
  <g>
    <rect x="370" y="365" width="300" height="81" rx="10" fill="#edf2fc"/>
    <text x="388" y="395" font-size="21" font-weight="700" fill="#284d9a">Copy &amp; setup drafts</text>
    <text x="388" y="427" font-size="17" font-weight="600" fill="#344b62">20 sets of ad copy</text>
  </g>
  <g>
    <rect x="688" y="365" width="300" height="81" rx="10" fill="#fff3d9"/>
    <text x="706" y="395" font-size="21" font-weight="700" fill="#805300">Open decisions</text>
    <text x="706" y="427" font-size="17" font-weight="600" fill="#344b62">Budget · attribution · old setup</text>
  </g>
  <text x="32" y="499" class="foot">Plan prepared; creatives, budget, attribution and old structures still need buyer review.</text>
  <text x="32" y="525" class="foot">Historical preparation only. Publication, effective state and performance require separate checks.</text>
</svg>
